services:
  kafka:
    image: docker.io/bitnamilegacy/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    user: root

    ports:
      - "80:9094"

    networks:
      - kafka-net

    volumes:
      - kafka_data:/bitnami/kafka

    environment:
      # KRaft Mode
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      # Listener Configuration
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      
      # Advertise port 80 to external clients like Databricks
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://${PUBLIC_IP}:80

      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

      # General Kafka Settings
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3

      # Debug
      - BITNAMI_DEBUG=yes

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui

    ports:
      - "12000:8080"

    networks:
      - kafka-net

    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

    depends_on:
      - kafka

volumes:
  kafka_data:

networks:
  kafka-net:
    driver: bridge